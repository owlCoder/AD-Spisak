name: ad-spisak-microservices

x-api-env: &api-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: ad_user
  DB_PASSWORD: ad_demo_password
  DB_NAME: ad_spisak
  DB_SSL_MODE: DISABLED
  DB_CONNECTION_LIMIT: "10"
  JWT_SECRET: local-demo-jwt-secret-change-me
  PORT: "3000"

x-api-common: &api-common
  build:
    context: ./api
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 15s

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_demo_password
      MYSQL_DATABASE: ad_spisak
      MYSQL_USER: ad_user
      MYSQL_PASSWORD: ad_demo_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_demo_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  auth-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: auth
    ports:
      - "3101:3000"

  users-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: users
    ports:
      - "3102:3000"

  subjects-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: subjects
    ports:
      - "3103:3000"

  attendance-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: attendance
    ports:
      - "3104:3000"

  points-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: points
    ports:
      - "3105:3000"

  projects-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: projects
    ports:
      - "3106:3000"

  defenses-service:
    <<: *api-common
    environment:
      <<: *api-env
      SERVICE_NAME: defenses
    ports:
      - "3107:3000"

  xlsx-service:
    build:
      context: ./xlsx-api
    environment:
      PORT: "3000"
      API_URL: http://gateway/api
      JWT_SECRET: local-demo-jwt-secret-change-me
    ports:
      - "3108:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      subjects-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      points-service:
        condition: service_healthy
      projects-service:
        condition: service_healthy
      defenses-service:
        condition: service_healthy
      xlsx-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./web
    environment:
      VITE_NAZIV_VERZIJA: "Microservices Docker - odbrana"
      VITE_API_URL: http://localhost:8080/api
      VITE_API_URL_EXCEL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
