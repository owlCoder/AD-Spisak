events {}

http {
  upstream auth_service { server auth-service:3000; }
  upstream users_service { server users-service:3000; }
  upstream subjects_service { server subjects-service:3000; }
  upstream attendance_service { server attendance-service:3000; }
  upstream points_service { server points-service:3000; }
  upstream projects_service { server projects-service:3000; }
  upstream defenses_service { server defenses-service:3000; }
  upstream xlsx_service { server xlsx-service:3000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location = /api/health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /api/xlsx/convert { proxy_pass http://users_service; }
    location ^~ /api/xlsx/ { proxy_pass http://xlsx_service; }

    location ^~ /api/auth/ { proxy_pass http://auth_service; }

    location = /api/studenti { proxy_pass http://users_service; }
    location ^~ /api/korisnik/ { proxy_pass http://users_service; }

    location = /api/predmeti { proxy_pass http://subjects_service; }
    location ^~ /api/predmet/ { proxy_pass http://subjects_service; }

    location ^~ /api/evidencija/ { proxy_pass http://attendance_service; }

    location = /api/export { proxy_pass http://points_service; }
    location ^~ /api/poeni/ { proxy_pass http://points_service; }

    location = /api/projektni-zadaci { proxy_pass http://projects_service; }
    location ^~ /api/projektni-zadatak/ { proxy_pass http://projects_service; }

    location = /api/termini { proxy_pass http://defenses_service; }
    location ^~ /api/termin/ { proxy_pass http://defenses_service; }

    location / {
      default_type application/json;
      return 404 '{"error":"Route not configured in API gateway"}';
    }
  }
}
